name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "config/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/**"
      - "config/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs-ci.yml"

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install --requirement requirements-docs.txt
      - run: python scripts/validate_markdown.py

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install --requirement requirements-docs.txt
      - run: python scripts/validate_docs.py

  frontmatter:
    name: Front Matter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install --requirement requirements-docs.txt
      - run: python scripts/validate_frontmatter.py

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install --requirement requirements-docs.txt
      - run: python scripts/validate_links.py

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install --requirement requirements-docs.txt
      - run: python scripts/validate_i18n.py

  spelling:
    name: Spelling (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: streetsidesoftware/cspell-action@v8
        with:
          config: config/cspell.json
          files: "docs/**/*.md"
          incremental_files_only: false
          strict: false
          suggestions: true
